bundle:
  name: agent_langgraph_short_term_memory

targets:
  dev:
    mode: development
    default: true

resources:
  apps:
    agent_langgraph_short_term_memory:
      name: "agent-memory-assistant"
      source_code_path: ./

      resources:
        # MLflow experiment for agent tracing  
        - name: 'experiment'
          experiment:
            experiment_id: '2211033810357765'
            permission: 'CAN_MANAGE'
            
        # Lakebase instance for memory storage
        - name: 'database'
          database:
            instance_name: 'agent-langgraph-memory-lb'
            database_name: 'postgres'
            permission: 'CAN_CONNECT_AND_CREATE'
